# 파일 변환 + 모니터링. 공개 포트는 web:8080 하나(나머지는 내부망).
# 실행: docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
name: file-converter

x-small: &small
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }

services:
  web:
    <<: *small
    build: { context: .., dockerfile: infra/web.Dockerfile, target: web, args: { PUBLIC_URL: '${PUBLIC_URL:-http://localhost:8080}', BUILD_ID: '${BUILD_ID:-dev}' } }
    ports: ['${WEB_PORT:-8080}:8080']
    depends_on: [api, ssr]
    volumes: [ssr-cache:/var/cache/nginx/ssr]
    networks: { default: {}, gf-proxy: { ipv4_address: 10.250.57.10 } } # 그라파나는 로그인 머리글(X-WEBAUTH-USER)을 이 주소에서 온 것만 믿는다

  # 미리 굽지 않은 주소(롱테일 변환 조합·404)를 요청 때 렌더. nginx가 결과를 캐시한다
  ssr:
    <<: *small
    build: { context: .., dockerfile: infra/web.Dockerfile, target: ssr, args: { PUBLIC_URL: '${PUBLIC_URL:-http://localhost:8080}', BUILD_ID: '${BUILD_ID:-dev}' } }
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    deploy: { resources: { limits: { memory: 192m } } }

  api:
    <<: *small
    build: { context: .., dockerfile: infra/api.Dockerfile, args: { BUILD_ID: '${BUILD_ID:-dev}' } }
    environment:
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH 필요}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET 필요}
      SECURE_COOKIE: ${SECURE_COOKIE:-true}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY_HOPS:-2} # api 앞 프록시 수: 운영(Cloudflare + 앞단 Caddy + nginx)=3, CDN 없는 로컬=1. 실제보다 크면 X-Forwarded-For 위조로 요청 제한이 뚫린다
      PROBE_URL: http://web:8080 # 합성 감시(1분마다 사이트를 직접 열어 봄)
      VM_URL: http://victoriametrics:8428
      VLOGS_URL: http://victorialogs:9428
      VMALERT_URL: http://vmalert:8880
      ALERTMANAGER_URL: http://alertmanager:9093
      DATA_DIR: /data
      RULES_FILE: /data/rules/fc.rules.yml
      ALERTMANAGER_FILE: /data/alertmanager/alertmanager.yml
      GRAFANA_CTL_DIR: /ctl # 그라파나 켜기·끄기(infra/grafana-ctl)
    volumes: [alerting:/data, grafana-ctl:/ctl]
    deploy: { resources: { limits: { memory: 256m } } }

  victoriametrics:
    <<: *small
    image: victoriametrics/victoria-metrics:v1.155.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=90d
      - -promscrape.config=/etc/vm/scrape.yml
      - -promscrape.configCheckInterval=30s # 긁을 대상이 바뀌면 스스로 다시 읽는다(ssr을 추가했는데 재시작 전까지 안 긁혀 배포 표시가 빠졌다)
      - -memory.allowedPercent=40
    volumes: [vm-data:/storage, ./vm/scrape.yml:/etc/vm/scrape.yml:ro]
    ports: ['127.0.0.1:8428:8428'] # 이 PC에서만 열람(디버깅용)
    deploy: { resources: { limits: { memory: 512m } } }

  victorialogs:
    <<: *small
    image: victoriametrics/victoria-logs:v1.53.0
    command: [-storageDataPath=/vlogs, -retentionPeriod=30d]
    volumes: [vlogs-data:/vlogs]
    deploy: { resources: { limits: { memory: 256m } } }

  vmalert:
    <<: *small
    image: victoriametrics/vmalert:v1.155.0
    command:
      - -datasource.url=http://victoriametrics:8428
      - -notifier.url=http://alertmanager:9093
      - -remoteWrite.url=http://victoriametrics:8428 # 알림 상태를 저장해 재시작해도 이어감
      - -remoteRead.url=http://victoriametrics:8428
      - -rule=/data/rules/*.yml
      - -external.url=${PUBLIC_URL:-http://localhost:8080}/admin
      - -evaluationInterval=30s
      - -configCheckInterval=30s # 규칙 파일이 늦게 생기거나 바뀌어도 스스로 다시 읽는다
    volumes: [alerting:/data:ro]
    # API가 규칙 파일을 만든 뒤에 시작(안 그러면 규칙 0개로 떠서 알림이 조용히 죽어 있었다 — 실제로 겪음)
    depends_on: { victoriametrics: { condition: service_started }, api: { condition: service_healthy } }

  alertmanager:
    <<: *small
    image: prom/alertmanager:v0.34.2
    command:
      - --config.file=/data/alertmanager/alertmanager.yml
      - --storage.path=/am
      - --web.external-url=${PUBLIC_URL:-http://localhost:8080}/admin
      - --web.route-prefix=/ # external-url에 경로가 있으면 모든 주소 앞에 /admin이 붙어 API·지표가 404가 됐다(실제로 겪음)
    volumes: [alerting:/data:ro, am-data:/am]
    extra_hosts: ['host.docker.internal:host-gateway'] # 리눅스 Docker는 이 이름을 기본으로 만들지 않는다(시험용 웹훅·생존 신호가 호스트로 가는 길)
    depends_on: { api: { condition: service_healthy } } # api가 처음 켤 때 설정 파일을 만든다

  # 운영자용 대시보드(지표·로그). 평소엔 꺼 두고 관리자 화면 스위치로 켠다(infra/grafana-ctl) → /grafana/(nginx가 관리자 세션 확인)
  # SSH 터널(127.0.0.1:3002/grafana/)로는 비밀번호 로그인
  grafana:
    <<: *small
    profiles: [grafana] # 그냥 up에는 안 켜진다
    image: grafana/grafana:13.2.4 # grafana/grafana-oss 이미지는 13.0.2(2026-06) 뒤로 갱신이 멈춰 같은 OSS판인 grafana/grafana를 쓴다
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 필요}
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_DEFAULT_LANGUAGE: ko-KR
      GF_SERVER_ROOT_URL: ${PUBLIC_URL:-http://localhost:8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_AUTH_PROXY_ENABLED: 'true'
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: 'true'
      GF_AUTH_PROXY_WHITELIST: 10.250.57.10 # web(nginx)만
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      # 기본으로 깔리는 앱 플러그인(탐색·트레이스 등)은 빼고 VictoriaLogs 데이터 소스만, 버전 고정
      GF_PLUGINS_PREINSTALL: ''
      GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource@0.33.1
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/overview.json
      GOMEMLIMIT: 400MiB # 상한보다 먼저 Go가 메모리를 거둔다. 13.x는 대시보드를 열면 300MB를 넘는다(256m·384m에선 상한에 계속 걸렸다)
    volumes: [grafana-data:/var/lib/grafana, ./grafana/provisioning:/etc/grafana/provisioning:ro, ./grafana/dashboards:/etc/grafana/dashboards:ro]
    ports: ['127.0.0.1:3002:3000'] # 공개하지 않는다
    depends_on: [victoriametrics, victorialogs]
    networks: { default: {}, gf-proxy: { aliases: [grafana-gf] } } # nginx는 grafana-gf로 불러 gf-proxy망(고정 주소)으로만 닿는다
    healthcheck: { test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/grafana/api/health'], interval: 5s, timeout: 3s, retries: 3 }
    deploy: { resources: { limits: { memory: 512m } } }

networks:
  default: {}
  # nginx → 그라파나 전용. 기본망 설정을 바꾸면 compose가 망을 다시 만들며 전체가 멈춰서 따로 둔다
  gf-proxy: { ipam: { config: [{ subnet: 10.250.57.0/24 }] } }

volumes:
  alerting: {}
  vm-data: {}
  vlogs-data: {}
  am-data: {}
  ssr-cache: {}
  grafana-data: {}
  grafana-ctl: {}
