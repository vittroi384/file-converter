# 공개 포트는 이것 하나. 순서: 구운 HTML(SSG) → 없으면 스트리밍 SSR(캐시) → /api 중계.
# 크롤러 요청은 내부 지표 포트로 복제해 센다(봇은 JS를 안 돌려 브라우저 통계에 안 잡힌다).

# SSR 결과 캐시: 롱테일 변환 조합 페이지는 한 번 렌더하면 하루 재사용, 만료 뒤에도 일주일은 옛 것을 주며 뒤에서 갱신
proxy_cache_path /var/cache/nginx/ssr levels=1:2 keys_zone=ssr:10m max_size=200m inactive=7d use_temp_path=off;

# 거친 봇 거름(정확한 분류는 API의 @fc/shared classifyCrawler 한곳에서)
map $http_user_agent $is_bot {
  default 0;
  ~*(bot|crawl|spider|slurp|chatgpt-user|claude-user|perplexity-user|google-extended|bytespider) 1;
}

# '/'에 처음 온 사람: 고른 언어(쿠키)가 없고 봇이 아니면 Accept-Language로 언어 주소를 고른다(SSR 서버가 q값까지 계산)
map "$is_bot:$cookie_lc_lang" $pick_lang {
  default 0;
  "0:" 1;
}

# SSR 캐시 키 = SSR 서버가 실제로 받는 주소 원문(쿼리는 뺀다 — SSR은 쿼리를 안 본다).
# 예전 키 $uri는 디코드된 주소라 /es/avif%2Dto-png(SSR엔 없는 주소 → 404)가 /es/avif-to-png 자리에 10분 캐시됐다(캐시 오염).
map $request_uri $ssr_cache_key {
  "~^(?<path>[^?]*)" $path;
}

# /grafana/ 웹소켓(실시간 갱신)
map $http_upgrade $gf_connection {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # 이동 주소는 상대 경로로. 절대 주소면 nginx 자신의 http·8080·Host가 박혀 앞단(HTTPS) 뒤에서 http://도메인:8080/…으로 보냈다
  absolute_redirect off;
  # 역슬래시가 든 주소는 거절: nginx는 글자로 보지만 SSR(WHATWG URL)·브라우저는 /로 바꿔
  # /a/..\__ssr/metrics가 내부 경로에 닿았고, 상대 이동 주소 /\evil.com은 다른 사이트로 간다
  if ($uri ~ "\\\\") { return 404; }
  charset utf-8;
  charset_types text/plain text/xml application/xml text/css application/javascript application/json;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm text/plain application/xml;
  gzip_min_length 1024;
  gzip_static on; # 빌드 때 미리 압축한 .gz가 있으면 그것을(브로틀리 .br은 이 이미지에 모듈이 없어 안 씀)

  # 크롤러 복제: 모든 요청을 /__crawl로 비춘다(봇이 아니면 거기서 바로 끝)
  mirror /__crawl;
  mirror_request_body off;
  location = /__crawl {
    internal;
    mirror off;
    if ($is_bot = 0) { return 204; }
    proxy_pass http://api:9464/internal/crawl;
    proxy_method POST;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Crawl-UA $http_user_agent;
    proxy_set_header X-Crawl-Path $request_uri;
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
  }

  # 해시가 붙은 파일: 1년 캐시. (Vary: Origin을 붙이지 않는다 — devlog 7절)
  location /assets/ {
    mirror off;
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location ~ ^/(demo|icons)/ {
    mirror off;
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }
  # 서비스 워커·매니페스트·테마 스크립트는 항상 새로 확인
  location ~ ^/(sw\.js|manifest\.webmanifest|theme\.js)$ {
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location /api/ {
    mirror off;
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
    include /etc/nginx/snippets/security.conf; # API 응답에도 nosniff 등
  }

  # 그라파나(관리자 화면 스위치로 켜고 끔). 관리자 세션을 api에 확인받고 X-WEBAUTH-USER로 자동 로그인
  location = /grafana { return 301 /grafana/; }
  location ^~ /grafana/ {
    mirror off;
    auth_request /__gf_auth;
    error_page 401 = @gf_login;
    error_page 502 503 504 = @gf_down;
    # 주소를 변수로 두면 요청 때 찾는다 → 그라파나가 꺼져 있어도 nginx가 뜬다
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gf_upstream grafana-gf:3000; # gf-proxy망 이름(그래야 그라파나가 보는 출발 주소가 web의 고정 주소)
    proxy_pass http://$gf_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-WEBAUTH-USER admin; # 손님이 보낸 같은 이름 머리글은 버려지고 이 값만 간다
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $gf_connection;
    proxy_read_timeout 1h;
    include /etc/nginx/snippets/grafana-security.conf;
  }
  location = /__gf_auth {
    internal;
    mirror off;
    proxy_pass http://api:8787/internal/grafana-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }
  location @gf_login { return 302 /admin#server; }
  location @gf_down {
    default_type text/html;
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "no-store" always;
    return 503 '<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>그라파나 꺼짐</title><p style="font:16px/1.6 system-ui;word-break:keep-all;margin:40px auto;max-width:32em;padding:0 16px">그라파나가 꺼져 있거나 켜는 중이에요. <a href="/admin#server">관리자 화면</a>에서 켜고 잠시 뒤 새로고침하세요.</p></html>';
  }

  # 영어는 접두어 없는 주소가 정식(/en/x → /x)
  location = /en { return 301 /; }
  location ^~ /en/ { rewrite ^/en/(.*)$ /$1 permanent; }
  # 내부 경로는 밖에서 못 연다
  location ^~ /__ssr/ { return 404; }

  location = / {
    if ($pick_lang) { rewrite ^ /__lang last; }
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "no-cache" always;
    add_header Vary "Accept-Language, Cookie" always;
    try_files /index.html =404;
  }
  location = /__lang {
    internal;
    mirror off; # 내부 이동 뒤 다시 비추면 봇이 두 번 세진다
    proxy_pass http://ssr:8790/__lang;
    proxy_set_header Accept-Language $http_accept_language;
    proxy_intercept_errors on;
    error_page 502 503 504 = /__static/index.html; # SSR이 죽어도 영어 첫 화면은 나간다
  }
  # SSR이 "영어 그대로"라고 답하면 X-Accel-Redirect로 여기 정적 파일을 준다
  location ^~ /__static/ {
    internal;
    mirror off;
    alias /usr/share/nginx/html/;
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "no-cache" always;
    add_header Vary "Accept-Language, Cookie" always;
  }

  location / {
    rewrite ^/(.+)/$ /$1 permanent; # 끝의 / 없는 주소가 정식
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html @ssr;
  }

  # 미리 굽지 않은 주소(롱테일 변환 조합 등)·404는 스트리밍 SSR
  location @ssr {
    # mirror는 끄지 않는다: try_files로 넘어오면 복제는 처음 location이 아니라 여기서 일어난다(꺼 두었더니 SSR 페이지 봇이 안 세졌다 — stack.mjs로 발견)
    proxy_pass http://ssr:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering on; # 캐시하려면 켜야 한다. 첫 요청만 SSR 속도, 이후는 캐시
    proxy_cache ssr;
    proxy_cache_key $ssr_cache_key;
    proxy_cache_valid 200 1d;
    proxy_cache_valid 404 10m;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_ignore_headers Set-Cookie;
    include /etc/nginx/snippets/security.conf;
    add_header X-Cache $upstream_cache_status always;
    # SSR 서버가 내려가 있고 캐시도 없으면 정적 404 페이지
    proxy_intercept_errors on;
    error_page 502 503 504 =404 /404.html;
  }
  location = /404.html { internal; include /etc/nginx/snippets/security.conf; }
}
