# 모든 응답에 붙는 보안 머리글. location 안에서 add_header를 쓰면 바깥 것이 상속되지 않아(nginx 규칙) 각 location이 이 파일을 include한다.
# WASM 스레드(SharedArrayBuffer)용 교차 출처 격리
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Embedder-Policy require-corp always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# 파일을 서버로 보내지 않는다는 약속을 브라우저가 강제하도록: 외부 연결은 같은 출처만
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
